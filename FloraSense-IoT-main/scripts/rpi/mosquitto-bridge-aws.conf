# ==============================================================================
# FloraSense IoT - Configuración de Puente MQTT (Mosquitto Bridge en Raspberry Pi)
# Ubicación en la Raspberry Pi: /etc/mosquitto/conf.d/bridge-aws.conf
# ==============================================================================
# Este puente permite que cuando un usuario pulsa "Activar Bomba" en la página web
# alojada en AWS, la orden viaje automáticamente a la Raspberry Pi y al NodeMCU.
# También envía los reconocimientos (ACKs) de vuelta a AWS.

connection florasense-aws-bridge
address TU_IP_PUBLICA_EC2_AWS:1883

# 1. Comandos (AWS -> Raspberry Pi -> NodeMCU)
# Recibe las órdenes emitidas por el backend de NestJS en AWS
topic iot/v1/devices/+/commands in 1

# 2. Confirmaciones ACK (NodeMCU -> Raspberry Pi -> AWS)
# Envía de vuelta el estado del relé a AWS
topic iot/v1/devices/+/acks out 1

# Configuración de reconexión y persistencia
cleansession false
clientid florasense_rpi_gateway
start_type automatic
restart_timeout 10 300
notifications false
