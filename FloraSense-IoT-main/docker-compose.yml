services:
  postgres:
    image: postgres:15-alpine
    container_name: smart_irrigation_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_irrigation
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_irrigation"]
      interval: 5s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: smart_irrigation_mqtt
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  api:
    image: node:20-alpine
    container_name: smart_irrigation_api
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    command: >
      sh -c "
        if [ ! -d 'node_modules' ] || [ ! -f 'node_modules/.bin/nest' ]; then
          echo '📦 Instalando dependencias del Monorepo en Docker...';
          npm install;
        fi;
        echo '🔄 Generando cliente de Prisma...';
        npx prisma generate --schema=apps/api/prisma/schema.prisma;
        echo '🚀 Sincronizando base de datos...';
        npx prisma db push --schema=apps/api/prisma/schema.prisma --accept-data-loss;
        echo '🌟 Iniciando NestJS API...';
        npm run start:dev -w apps/api;
      "
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/smart_irrigation?schema=public
      - MQTT_BROKER_URL=mqtt://mosquitto:1883
      - PORT=3001
    restart: unless-stopped

  prisma_studio:
    image: node:20-alpine
    container_name: smart_irrigation_studio
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    command: >
      sh -c "
        while [ ! -f 'node_modules/.bin/prisma' ]; do
          sleep 3;
        done;
        npx prisma studio --schema=apps/api/prisma/schema.prisma --port 5555 --hostname 0.0.0.0;
      "
    ports:
      - "5555:5555"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/smart_irrigation?schema=public
    restart: unless-stopped

  web:
    image: node:20-alpine
    container_name: smart_irrigation_web
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      - api
    command: >
      sh -c "
        echo '⏳ Esperando a que terminen de instalarse las dependencias...';
        while [ ! -f 'node_modules/.bin/next' ] && [ ! -f 'apps/web/node_modules/.bin/next' ]; do
          sleep 3;
        done;
        echo '🌟 Iniciando Next.js Web en puerto 3000...';
        npm run dev -w apps/web;
      "
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://${EC2_PUBLIC_IP:-localhost}:3001/api/v1
      - EC2_PUBLIC_IP=${EC2_PUBLIC_IP:-}
    restart: unless-stopped

volumes:
  pgdata:
  mosquitto_data:
  mosquitto_log:
